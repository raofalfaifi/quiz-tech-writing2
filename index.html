<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MT1 Sample Exams — نماذج الاختبار النصفي</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#1c1f26; --muted:#667085; --border:#dfe3ec;
  --accent:#2f5dff; --accent-soft:#e8edff; --ok:#16a34a; --ok-bg:#e7f8ee; --bad:#dc2626; --bad-bg:#fdeaea;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12141a; --card:#1b1e27; --text:#e8eaf0; --muted:#98a0b3; --border:#2c3140;
    --accent:#6f8dff; --accent-soft:#232a44; --ok:#34d27b; --ok-bg:#12301f; --bad:#ff6b6b; --bad-bg:#3a1a1a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.ar{direction:rtl;text-align:right}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .25s}
.q-en{font-size:1.15rem;font-weight:600;margin:0}
.q-ar{font-size:1.1rem;margin:6px 0 18px;color:var(--muted);direction:rtl;text-align:right}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card);color:var(--text);border:1.5px solid var(--border);border-radius:12px;
  padding:12px 14px;font:inherit;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .t{flex:1;unicode-bidi:plaintext}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong .k{background:var(--bad);color:#fff}
.exp{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--accent-soft);
  border-inline-start:4px solid var(--accent);direction:rtl;text-align:right}
.exp b{display:block;margin-bottom:2px}
.verdict{font-weight:700;margin-top:14px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;
  background:var(--accent);color:#fff}
button.btn.sec{background:transparent;color:var(--text);border:1.5px solid var(--border)}
button.btn:disabled{opacity:.5;cursor:not-allowed}
label.chk{display:flex;gap:8px;align-items:center;margin:8px 0;cursor:pointer}
.score{font-size:3rem;font-weight:800;margin:6px 0;color:var(--accent)}
.rev{border-top:1px solid var(--border);padding:14px 0}
.rev .en{font-weight:600} .rev .a{color:var(--muted);direction:rtl;text-align:right}
.rev .y{color:var(--bad)} .rev .c{color:var(--ok)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

  <!-- Start screen -->
  <div id="start" class="card">
    <h1>MT1 Sample Exams</h1>
    <p class="sub ar">نماذج الاختبار النصفي — 90 سؤال مع شرح عربي بعد كل إجابة</p>
    <label class="chk"><input type="checkbox" id="shQ"> Shuffle questions — ترتيب الأسئلة عشوائي</label>
    <label class="chk"><input type="checkbox" id="shO"> Shuffle choices — ترتيب الخيارات عشوائي</label>
    <label class="chk">
      Part — الجزء:&nbsp;
      <select id="part">
        <option value="all">All 90 — كل الأسئلة</option>
        <option value="1">MT1_1 (1–30) — النموذج 1</option>
        <option value="2">MT1_2 (31–60) — النموذج 2</option>
        <option value="3">MT1_3 (61–90) — النموذج 3</option>
        <option value="tf">True / False only (45) — صح وخطأ فقط</option>
        <option value="mc">Multiple choice only (45) — اختيار من متعدد فقط</option>
      </select>
    </label>
    <div class="row"><button class="btn" id="startBtn">Start — ابدأ</button></div>
  </div>

  <!-- Quiz screen -->
  <div id="quiz" class="card hide">
    <div class="top"><span id="counter"></span><span id="scoreLive"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <p class="q-en" id="qen"></p>
    <p class="q-ar" id="qar"></p>
    <div class="opts" id="opts"></div>
    <div id="feedback"></div>
    <div class="row"><button class="btn hide" id="nextBtn">Next — التالي</button></div>
  </div>

  <!-- Result screen -->
  <div id="result" class="card hide">
    <h1>Result — النتيجة</h1>
    <div class="score" id="finalScore"></div>
    <p class="sub" id="finalMsg"></p>
    <div class="row">
      <button class="btn" id="retryAll">Restart — إعادة الاختبار</button>
      <button class="btn sec" id="retryWrong">Retry mistakes — إعادة الأخطاء فقط</button>
    </div>
    <h2 style="margin-top:26px;font-size:1.1rem">Mistakes review — مراجعة الأخطاء</h2>
    <div id="review"></div>
  </div>

</div>

<script>
/* ---------- Data ---------- */
const M=(q,a,o,c,e)=>({q,a,o,c,e});
const T=(q,a,v,e)=>({q,a,o:[`True — صح`,`False — خطأ`],c:v?0:1,e,tf:true});

const QUESTIONS=[
/* ===== MT1_1 : True / False ===== */
T(`A technical report always has a clear purpose, such as explaining results or solving a problem.`,
  `التقرير التقني دائمًا له غرض واضح، مثل شرح النتائج أو حل مشكلة.`,true,
  `صح. من سمات الكتابة التقنية أن لها غرضًا (Has a purpose).`),
T(`In technical writing, frequent use of I and we makes the report more professional.`,
  `في الكتابة التقنية، الإكثار من استخدام I وwe يجعل التقرير أكثر احترافية.`,false,
  `خطأ. الكتابة التقنية Impersonal (ضمير الغائب)، والإكثار من ضمائر المتكلم لا يزيدها احترافية.`),
T(`Technical writing can be effective even without facts or data to support its statements.`,
  `يمكن أن تكون الكتابة التقنية فعّالة حتى بدون حقائق أو بيانات تدعم عباراتها.`,false,
  `خطأ. الكتابة التقنية تعتمد على الحقائق والبيانات (Conveys information/facts/data).`),
T(`Developing something new is one of the toughest types of technical studies and often requires significant time, effort, and collaboration.`,
  `تطوير شيء جديد من أصعب أنواع الدراسات التقنية وغالبًا يتطلب وقتًا وجهدًا وتعاونًا كبيرًا.`,true,
  `صح. Develop something new: احتمال النجاح أقل، وكأن الإدارة تطلب اختراعًا.`),
T(`Copying full passages from online sources or friends without giving credit is considered intentional plagiarism.`,
  `نسخ فقرات كاملة من مصادر على الإنترنت أو من الأصدقاء دون ذكر المصدر يُعد انتحالًا متعمدًا.`,true,
  `صح. النسخ الكامل دون توثيق انتحال متعمد (Intentional plagiarism).`),
T(`Technical documents rarely go beyond the fourth-level heading.`,
  `نادرًا ما تتجاوز المستندات التقنية المستوى الرابع من العناوين.`,true,
  `صح. من غير الشائع تجاوز المستوى الرابع في معظم الوثائق التقنية.`),
T(`A document is considered changeable if it can be easily modified or updated when necessary.`,
  `يُعد المستند قابلًا للتغيير إذا أمكن تعديله أو تحديثه بسهولة عند الحاجة.`,true,
  `صح. Changeability = سهولة التعديل (ترقيم وتخزين إلكتروني).`),
T(`Using very old references (for example, over ten years old) may be inappropriate for rapidly changing technologies.`,
  `استخدام مراجع قديمة جدًا (مثلًا أكثر من عشر سنوات) قد يكون غير مناسب للتقنيات سريعة التغير.`,true,
  `صح. المراجع القديمة جدًا غير مناسبة للتقنيات التي تتغير بسرعة.`),
T(`Formal reports usually contain information with short-term value only.`,
  `التقارير الرسمية تحتوي عادةً على معلومات ذات قيمة قصيرة المدى فقط.`,false,
  `خطأ. المستندات الرسمية تحتوي معلومات ذات قيمة طويلة المدى (Archival).`),
T(`A student paraphrases a paragraph from a website but forgets to cite the source. This is an example of unintentional plagiarism.`,
  `طالب يعيد صياغة فقرة من موقع إلكتروني لكنه ينسى ذكر المصدر. هذا مثال على الانتحال غير المتعمد.`,true,
  `صح. نسيان التوثيق دون قصد يُعد Unintentional plagiarism، وهو غير مقبول أيضًا.`),
T(`If a report has more than one audience, it is important to know about each audience separately.`,
  `إذا كان للتقرير أكثر من فئة قراء، فمن المهم معرفة كل فئة على حدة.`,true,
  `صح. لازم تفهم احتياجات كل فئة من القراء حتى لا تُهمل أي منها.`),
T(`Writing technical documents such as reports, manuals, or books is usually organized in a hierarchical structure.`,
  `كتابة المستندات التقنية مثل التقارير والأدلة والكتب تكون عادةً منظمة بشكل هرمي.`,true,
  `صح. الكتابة الهرمية: من المجرد (مستوى عالٍ) إلى التفاصيل (مستوى منخفض).`),
T(`Nontechnical readers usually require more explanation of basic concepts than technical readers.`,
  `القراء غير التقنيين يحتاجون عادةً إلى شرح أكثر للمفاهيم الأساسية مقارنةً بالقراء التقنيين.`,true,
  `صح. غير التقنيين يحتاجون شرحًا أكثر للمفاهيم التمهيدية.`),
T(`External consistency means the document agrees with other related documents, regulations, and standards.`,
  `الاتساق الخارجي يعني أن المستند يتفق مع المستندات واللوائح والمعايير الأخرى ذات العلاقة.`,true,
  `صح. External consistency = توافق مع المستندات والمعايير المطبقة.`),
T(`A reference list reflects the writer’s familiarity and credibility with the subject matter.`,
  `قائمة المراجع تعكس إلمام الكاتب بالموضوع ومصداقيته فيه.`,true,
  `صح. المراجع الحديثة والموثوقة تدل على إلمامك بالموضوع.`),

/* ===== MT1_1 : Multiple choice ===== */
M(`A broad term that encompasses a wide variety of documents in science, engineering, and the skilled trades — including reports, technical papers, patents, and operational manuals. What is this called?`,
  `مصطلح واسع يشمل أنواعًا كثيرة من المستندات في العلوم والهندسة والمهن الماهرة، بما فيها التقارير والأوراق التقنية والبراءات وأدلة التشغيل. ماذا يُسمى؟`,
  [`Technical Report — تقرير تقني`,
   `Technical Paper — ورقة تقنية`,
   `Patent — براءة اختراع`,
   `Technical Writing — الكتابة التقنية`],3,
  `Technical Writing هو المصطلح الشامل، والتقارير والبراءات والأدلة أنواع تندرج تحته.`),
M(`A report that clearly states why the work was done, what was done, and what results were found shows which attribute of technical writing?`,
  `تقرير يوضح بجلاء لماذا أُنجز العمل، وماذا أُنجز، وما النتائج التي وُجدت. أي سمة من سمات الكتابة التقنية يُظهر ذلك؟`,
  [`Has an objective — له هدف`,
   `Has a purpose — له غرض`,
   `Directed to readers — موجَّه للقراء`,
   `Impersonal voice — أسلوب غير شخصي`],1,
  `الغرض (purpose) = عرض ما تم ولماذا وما نتائجه. أما الهدف (objective) فهو السبب العام للعمل كزيادة الأرباح.`),
M(`This type of technical study is supported when it can improve industrial processes or increase efficiency and profits. It focuses on determining the underlying reasons why things happen in the sciences. What is this type of study?`,
  `هذا النوع من الدراسات التقنية يُدعم عندما يمكنه تحسين العمليات الصناعية أو زيادة الكفاءة والأرباح. ويركز على معرفة الأسباب الكامنة وراء حدوث الأشياء في العلوم. ما هذا النوع من الدراسات؟`,
  [`Feasibility Study — دراسة الجدوى`,
   `Failure Analysis — تحليل الفشل`,
   `Research a Mechanism — بحث آلية`,
   `Develop Something New — تطوير شيء جديد`],2,
  `Research a mechanism: دراسة سبب حدوث الأشياء، وتُدعم فقط إذا كانت لها قيمة اقتصادية.`),
M(`This is one of the most challenging kinds of studies — it involves inventing or improving a new material, process, or machine, usually requiring collaboration, creativity, and significant effort.`,
  `هذا من أصعب أنواع الدراسات، فهو يشمل اختراع أو تحسين مادة أو عملية أو آلة جديدة، ويتطلب عادةً تعاونًا وإبداعًا وجهدًا كبيرًا.`,
  [`Develop Something New — تطوير شيء جديد`,
   `Research a Mechanism — بحث آلية`,
   `Failure Analysis — تحليل الفشل`,
   `Solve a Problem — حل مشكلة`],0,
  `Develop something new هو الأصعب: يحتاج إبداعًا وتعاونًا وجهدًا كبيرًا.`),
M(`This section of a report answers the question “What does all this mean?”, relates findings back to the purpose, summarizes main points, and should not introduce new information. Which section is this?`,
  `هذا القسم من التقرير يجيب عن سؤال «ماذا يعني كل هذا؟»، ويربط النتائج بالغرض، ويلخص النقاط الرئيسية، ولا ينبغي أن يقدم معلومات جديدة. أي قسم هو؟`,
  [`Introduction — المقدمة`,
   `Discussion — المناقشة`,
   `Conclusion — الخاتمة`,
   `Recommendations — التوصيات`],2,
  `الخاتمة (Conclusion) تلخص وتربط بالغرض ولا تضيف معلومات جديدة.`),
M(`This section helps a busy reader quickly understand the report’s purpose, key findings, and main conclusions without reading the whole document. It is written last but appears first in the report.`,
  `هذا القسم يساعد القارئ المشغول على فهم غرض التقرير ونتائجه الرئيسية واستنتاجاته دون قراءة المستند كاملًا. يُكتب أخيرًا لكنه يظهر أولًا في التقرير.`,
  [`Discussion — المناقشة`,
   `Introduction — المقدمة`,
   `Summary / Abstract — الملخص`,
   `Conclusion — الخاتمة`],2,
  `الملخص (Summary / Abstract) يُكتب في الآخر ويوضع في البداية، وهو حوالي 10٪ من التقرير.`),
M(`Which of the following does require documentation in academic writing?`,
  `أي مما يلي يتطلب توثيقًا في الكتابة الأكاديمية؟`,
  [`A common fact that everyone knows, such as “water boils at 100°C.” — حقيقة شائعة يعرفها الجميع، مثل «الماء يغلي عند 100 درجة مئوية».`,
   `A direct quotation from a research article. — اقتباس مباشر من مقالة بحثية.`,
   `A personal reflection about your learning process. — تأمل شخصي حول عملية تعلمك.`,
   `A general statement like “many people use social media daily.” — عبارة عامة مثل «كثير من الناس يستخدمون وسائل التواصل يوميًا».`],1,
  `الاقتباس المباشر لازم يُوثَّق دائمًا. المعلومات الشائعة والرأي الشخصي لا تحتاج توثيقًا.`),
M(`This audience group has the least technical knowledge. They may simply be curious about a technical matter or need to understand it for a practical reason. Sometimes, they must make important decisions based on reports. Who are they?`,
  `هذه الفئة من القراء لديها أقل معرفة تقنية. قد يكونون فضوليين فقط تجاه أمر تقني أو يحتاجون لفهمه لسبب عملي، وأحيانًا يضطرون لاتخاذ قرارات مهمة بناءً على التقارير. من هم؟`,
  [`Experts — الخبراء`,
   `Non-specialists — غير المتخصصين`,
   `Technicians — الفنيون`,
   `Executives — المديرون التنفيذيون`],1,
  `Non-specialists = أقل فئة معرفةً تقنية، وأحيانًا يتخذون قرارات بناءً على التقارير.`),
M(`In technical writing it is important to choose the right words. Choose the sentence that avoids vague or fuzzy modifiers.`,
  `في الكتابة التقنية من المهم اختيار الكلمات المناسبة. اختر الجملة التي تتجنب الصفات الغامضة أو المبهمة.`,
  [`The experiment results were kind of similar to what we expected. — كانت نتائج التجربة نوعًا ما مشابهة لما توقعناه.`,
   `The results were approximately close to being right. — كانت النتائج قريبة تقريبًا من أن تكون صحيحة.`,
   `The results matched the expected values within a 2% difference. — طابقت النتائج القيم المتوقعة بفارق لا يتجاوز 2٪.`,
   `The results were somewhat good and nearly correct. — كانت النتائج جيدة إلى حد ما وشبه صحيحة.`],2,
  `الدقة = رقم قابل للقياس (2٪) بدل كلمات غامضة مثل kind of / approximately / somewhat / nearly.`),
M(`Identify the sentence that needs improvement for precision.`,
  `حدد الجملة التي تحتاج إلى تحسين من ناحية الدقة.`,
  [`The material expands slightly when heated. — تتمدد المادة قليلًا عند تسخينها.`,
   `The material expands by 0.3% when heated to 100°C. — تتمدد المادة بنسبة 0.3٪ عند تسخينها إلى 100 درجة مئوية.`,
   `The material maintains its strength when heated. — تحافظ المادة على قوتها عند التسخين.`,
   `The test confirmed stable expansion under heat. — أكد الاختبار تمددًا مستقرًا تحت الحرارة.`],0,
  `كلمة slightly غامضة وغير قابلة للقياس، أما الجملة (b) فتحتوي نسبة ودرجة حرارة محددتين.`),
M(`This stage of writing usually takes the longest time. It requires writing full sentences and paragraphs, organizing ideas into a structured form, and adding transitions between them. Which stage of writing is this?`,
  `هذه المرحلة من الكتابة تستغرق عادةً أطول وقت. تتطلب كتابة جمل وفقرات كاملة، وتنظيم الأفكار في شكل مترابط، وإضافة روابط بينها. أي مرحلة هي؟`,
  [`Drafting — كتابة المسودة`,
   `Revising — المراجعة`,
   `Editing — التدقيق`,
   `Publishing — النشر`],0,
  `Drafting هي أصعب مرحلة وأطولها: جمل وفقرات كاملة مع الروابط بينها.`),
M(`At this stage, you focus on improving logic, shortening text, and asking others to review your work. Which stage is it?`,
  `في هذه المرحلة تركز على تحسين المنطق وتقصير النص وطلب مراجعة الآخرين لعملك. أي مرحلة هي؟`,
  [`Editing — التدقيق`,
   `Revising — المراجعة`,
   `Brainstorming — العصف الذهني`,
   `Publishing — النشر`],1,
  `Revising: تحسين المنطق وتقصير النص وطلب مراجعين (واحد تقني وواحد غير تقني على الأقل).`),
M(`Which item is classified under Miscellaneous technical document?`,
  `أي عنصر يُصنَّف ضمن المستندات التقنية المتنوعة (Miscellaneous)؟`,
  [`Test report — تقرير اختبار`,
   `Journal publication — منشور في مجلة علمية`,
   `Executive summary — ملخص تنفيذي`,
   `Safety note — مذكرة سلامة`],2,
  `Miscellaneous تشمل مثل: Executive summary وMeeting minutes وResumes. أما Safety note فمذكرة تقنية (Informal).`),
M(`Documents such as Meeting Minutes and Resumes are most appropriately classified under which type?`,
  `المستندات مثل محاضر الاجتماعات والسير الذاتية تُصنَّف بشكل أنسب تحت أي نوع؟`,
  [`Miscellaneous — متنوعة`,
   `Formal — رسمية`,
   `Informal — غير رسمية`,
   `Technical Report — تقرير تقني`],0,

/* ---------- State ---------- */
const $=id=>document.getElementById(id);
let list=[], idx=0, score=0, wrongs=[], locked=false;

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const show=id=>["start","quiz","result"].forEach(x=>$(x).classList.toggle("hide",x!==id));

function prepare(src,shQ,shO){
  let arr=src.map(q=>({...q}));
  if(shO){
    arr=arr.map(q=>{
      if(q.tf) return q;
      const order=shuffle(q.o.map((_,i)=>i));
      return {...q,o:order.map(i=>q.o[i]),c:order.indexOf(q.c)};
    });
  }
  return shQ?shuffle(arr):arr;
}

function begin(src){
  list=src; idx=0; score=0; wrongs=[];
  show("quiz"); render();
}

function render(){
  locked=false;
  const q=list[idx];
  $("counter").textContent=`Question ${idx+1} / ${list.length} — السؤال ${idx+1} من ${list.length}`;
  $("scoreLive").textContent=`Score — النتيجة: ${score}`;
  $("prog").style.width=(idx/list.length*100)+"%";
  $("qen").textContent=`${idx+1}. ${q.q}`;
  $("qar").textContent=q.a;
  $("feedback").innerHTML="";
  $("nextBtn").classList.add("hide");
  $("nextBtn").textContent=idx===list.length-1?"Finish — إنهاء":"Next — التالي";
  const box=$("opts"); box.innerHTML="";
  q.o.forEach((txt,i)=>{
    const b=document.createElement("button");
    b.className="opt";
    const k=document.createElement("span"); k.className="k"; k.textContent=String.fromCharCode(65+i);
    const t=document.createElement("span"); t.className="t"; t.textContent=txt;
    b.append(k,t);
    b.onclick=()=>answer(i);
    box.appendChild(b);
  });
}

function answer(i){
  if(locked) return; locked=true;
  const q=list[idx];
  const btns=[...$("opts").children];
  btns.forEach((b,j)=>{
    b.disabled=true;
    if(j===q.c) b.classList.add("correct");
    else if(j===i) b.classList.add("wrong");
  });
  const ok=i===q.c;
  if(ok) score++; else wrongs.push({q,picked:i});
  $("scoreLive").textContent=`Score — النتيجة: ${score}`;
  const f=$("feedback");
  f.innerHTML="";
  const v=document.createElement("div");
  v.className="verdict "+(ok?"ok":"no");
  v.textContent=ok?"✓ Correct — إجابة صحيحة":"✗ Incorrect — إجابة خاطئة";
  const e=document.createElement("div");
  e.className="exp";
  e.innerHTML="<b>الشرح:</b>";
  e.append(document.createTextNode(q.e));
  f.append(v,e);
  $("nextBtn").classList.remove("hide");
  $("nextBtn").focus();
}

function next(){
  if(idx<list.length-1){idx++;render();}
  else finish();
}

function finish(){
  $("prog").style.width="100%";
  show("result");
  const pct=Math.round(score/list.length*100);
  $("finalScore").textContent=`${score} / ${list.length}  (${pct}%)`;
  $("finalMsg").textContent=pct>=90?"ممتاز! — Excellent!":pct>=75?"جيد جدًا — Very good":pct>=50?"جيد، راجع الأخطاء — Fair, review your mistakes":"تحتاج مراجعة أكثر — Needs more review";
  $("retryWrong").classList.toggle("hide",wrongs.length===0);
  const r=$("review"); r.innerHTML="";
  if(!wrongs.length){r.textContent="No mistakes — لا توجد أخطاء 🎉";return;}
  wrongs.forEach(({q,picked})=>{
    const d=document.createElement("div"); d.className="rev";
    const en=document.createElement("div"); en.className="en"; en.textContent=q.q;
    const a=document.createElement("div"); a.className="a"; a.textContent=q.a;
    const y=document.createElement("div"); y.className="y"; y.textContent="✗ "+q.o[picked];
    const c=document.createElement("div"); c.className="c"; c.textContent="✓ "+q.o[q.c];
    const e=document.createElement("div"); e.className="ar"; e.textContent=q.e;
    d.append(en,a,y,c,e); r.appendChild(d);
  });
}

/* ---------- Events ---------- */
$("startBtn").onclick=()=>{
  const p=$("part").value;
  let src=QUESTIONS;
  if(p==="tf") src=QUESTIONS.filter(q=>q.tf); else if(p==="mc") src=QUESTIONS.filter(q=>!q.tf); else if(p!=="all"){const s=(+p-1)*30; src=QUESTIONS.slice(s,s+30);}
  begin(prepare(src,$("shQ").checked,$("shO").checked));
};
$("nextBtn").onclick=next;
$("retryAll").onclick=()=>show("start");
$("retryWrong").onclick=()=>begin(prepare(wrongs.map(w=>w.q),$("shQ").checked,$("shO").checked));
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hide")) return;
  if(!locked && /^[1-4]$/.test(e.key)){const n=+e.key-1; if(n<list[idx].o.length) answer(n);}
  else if(locked && e.key==="Enter") next();
});
</script>
